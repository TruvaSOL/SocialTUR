<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#6fb4ea" />
    <title></title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>
    <div id="ui">
      <div class="chip title">
        <strong id="game-name"></strong>
        <span data-i18n="stage.label"></span>
      </div>
      <div class="buttons">
        <button id="btn-lang" class="chip" type="button"></button>
        <button id="btn-stats" class="chip" type="button" data-i18n="stats.button" hidden></button>
      </div>
      <div id="counter" class="chip counter"></div>
      <div id="seat-label" class="chip seat-label" hidden></div>
      <div class="actions">
        <button id="btn-ticket" class="chip primary-chip" type="button" data-i18n="ticket.button" hidden></button>
        <button id="btn-view" class="chip" type="button" hidden></button>
        <button id="btn-character" class="chip" type="button" data-i18n="editor.button" hidden></button>
        <button id="btn-chat" class="chip" type="button"></button>
        <button id="btn-demo" class="chip" type="button" hidden></button>
      </div>
      <pre id="stats" class="chip" hidden></pre>
      <div id="banner" class="chip banner" hidden><strong></strong><span></span></div>
      <div id="chat" class="chat" hidden></div>
      <div id="sheet" class="sheet" hidden></div>
      <div id="ad" class="ad-overlay" hidden></div>
      <div class="chip hint" data-i18n="hint.camera"></div>
    </div>
    <pre id="crash" hidden></pre>
    <script>
      // If the game fails to start, say so on screen: phones have no console to look at.
      // This runs before the game (and its translations) load, so the heading is written in both languages here.
      (function () {
        var box = document.getElementById('crash');
        function show(detail) {
          box.hidden = false;
          if (!box.textContent) box.textContent = 'Oyun açılamadı / The game could not start\n\n' + navigator.userAgent + '\n';
          box.textContent += '\n' + detail;
        }
        window.addEventListener('error', function (e) {
          show(e.message ? e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')' : 'A file failed to load: ' + ((e.target && (e.target.src || e.target.href)) || '?'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show(String((e.reason && e.reason.message) || e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
