<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#8fd0f2" />
    <title></title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui">
      <div class="chip title">
        <strong id="game-name"></strong>
        <span data-i18n="stage.label"></span>
      </div>
      <div class="buttons">
        <button id="btn-lang" class="chip" type="button"></button>
        <button id="btn-stats" class="chip" type="button" data-i18n="stats.button"></button>
      </div>
      <div class="actions">
        <button id="btn-account" class="chip" type="button" data-i18n="account.button" hidden></button>
        <button id="btn-character" class="chip" type="button" data-i18n="editor.button"></button>
        <button id="btn-view" class="chip" type="button"></button>
        <button id="btn-crowd" class="chip" type="button"></button>
        <button id="btn-houses" class="chip" type="button"></button>
        <button id="btn-build" class="chip" type="button"></button>
      </div>
      <pre id="stats" class="chip" hidden></pre>
      <div id="banner" class="chip banner" hidden><strong></strong><span></span></div>
      <div id="sheet" class="sheet" hidden></div>
      <div class="chip hint" data-i18n="hint.camera"></div>
    </div>
    <pre id="crash" hidden></pre>
    <script>
      // If the game fails to start, say so on screen: phones have no console to look at.
      // This runs before the game (and its translations) load, so the heading is written in both languages here.
      (function () {
        var box = document.getElementById('crash');
        function show(detail) {
          box.hidden = false;
          if (!box.textContent) box.textContent = 'Oyun açılamadı / The game could not start\n\n' + navigator.userAgent + '\n';
          box.textContent += '\n' + detail;
        }
        window.addEventListener('error', function (e) {
          show(e.message ? e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')' : 'A file failed to load: ' + ((e.target && (e.target.src || e.target.href)) || '?'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show(String((e.reason && e.reason.message) || e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
